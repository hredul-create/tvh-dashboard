<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growth Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --paper: #F5F6F8;
      --card: #FFFFFF;
      --ink: #14181F;
      --muted: #6B7280;
      --faint: #A2A8B3;
      --navy: #1B2A4A;
      --accent: #2F5FFF;
      --accent-soft: #EAEFFF;
      --border: #E4E7EC;

      --good: #1F9D63;
      --good-soft: #E7F6EE;
      --warn: #C77D0A;
      --warn-soft: #FBF0DD;
      --risk: #D3453B;
      --risk-soft: #FBEAE9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
    }

    #app {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 20px 60px;
    }

    .wrap { max-width: 1040px; margin: 0 auto; }

    /* ---- Top / Tabs ---- */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 27px;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .sub { color: var(--muted); font-size: 13.5px; margin: 0; }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 24px;
      width: fit-content;
    }
    .tab {
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      border: none;
      background: transparent;
      transition: all 0.15s ease;
    }
    .tab.active {
      background: var(--navy);
      color: white;
    }
    .tab:not(.active):hover { color: var(--ink); background: var(--paper); }

    .panel { display: none; }
    .panel.active { display: block; }

    /* ---- Shared summary strip ---- */
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    @media (max-width: 720px) { .summary { grid-template-columns: repeat(2, 1fr); } }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .stat-label { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px; font-weight: 700; color: var(--navy);
      display: flex; align-items: baseline; gap: 6px;
    }
    .stat-value span { font-size: 13px; font-weight: 500; color: var(--faint); }

    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.good { background: var(--good); }
    .dot.warn { background: var(--warn); }
    .dot.risk { background: var(--risk); }

    /* ================= PLAN PANEL ================= */
    .plan-progress {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 16px; margin-bottom: 20px; width: fit-content;
    }
    .ring { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
    .ring svg { transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 4; }
    .ring-fg { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; transition: stroke-dasharray 0.4s ease; }
    .ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; }
    .progress-text { font-size: 13px; color: var(--muted); line-height: 1.3; }
    .progress-text strong { color: var(--ink); font-size: 14px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 14px; display: flex; flex-direction: column; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; gap: 8px; }
    .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; }
    .card-count { font-size: 12px; color: var(--faint); white-space: nowrap; }
    .card-tag { display: inline-block; font-size: 11px; color: var(--muted); margin-bottom: 12px; }

    .tasks { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
    .task { display: flex; align-items: flex-start; gap: 10px; padding: 7px 4px; border-radius: 6px; cursor: pointer; }
    .task:hover { background: var(--paper); }
    .check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
    .check.on { background: var(--good); border-color: var(--good); }
    .check svg { width: 11px; height: 11px; opacity: 0; transition: opacity 0.1s; }
    .check.on svg { opacity: 1; }
    .task-label { font-size: 14px; line-height: 1.4; color: var(--ink); }
    .task.done .task-label { color: var(--faint); text-decoration: line-through; }

    .add-row { display: flex; gap: 6px; margin-top: 6px; margin-bottom: 12px; }
    .add-row input { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 13px; font-family: 'Inter', sans-serif; background: var(--paper); color: var(--ink); }
    .add-row input:focus { outline: none; border-color: var(--accent); }
    .add-row button { border: none; background: var(--accent); color: white; border-radius: 6px; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
    .add-row button:hover { opacity: 0.9; }

    .notes-toggle { font-size: 12px; color: var(--muted); cursor: pointer; border-top: 1px solid var(--border); padding-top: 10px; margin-top: auto; display: flex; align-items: center; gap: 5px; }
    .notes-toggle:hover { color: var(--ink); }
    textarea.notes { width: 100%; margin-top: 8px; border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 13px; font-family: 'Inter', sans-serif; color: var(--ink); background: var(--paper); resize: vertical; min-height: 50px; }
    textarea.notes:focus { outline: none; border-color: var(--accent); }

    .del-x { opacity: 0; margin-left: auto; color: var(--faint); font-size: 15px; padding: 0 4px; flex-shrink: 0; cursor: pointer; }
    .task:hover .del-x { opacity: 1; }
    .del-x:hover { color: #d33; }

    .status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); background: var(--paper); border: 1px solid var(--border); padding: 3px 8px; border-radius: 20px; }
    .status-pill.ongoing { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

    /* ================= KPI PANEL ================= */
    .kra-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
    .kra-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
    .kra-avg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .kra-avg strong { color: var(--ink); font-size: 15px; font-family: 'Space Grotesk', sans-serif; }

    .kpi-row { display: grid; grid-template-columns: 1.6fr 0.7fr 0.7fr 1.4fr 0.6fr auto; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .kpi-row:last-child { border-bottom: none; }
    .kpi-row.head-row { background: var(--paper); font-size: 11px; color: var(--faint); padding: 8px 20px; }

    @media (max-width: 700px) {
      .kpi-row { grid-template-columns: 1fr; gap: 6px; padding: 14px 16px; }
      .kpi-row.head-row { display: none; }
      .kpi-cell::before { content: attr(data-label); display: block; font-size: 10.5px; color: var(--faint); margin-bottom: 2px; }
    }

    .kpi-label input { border: none; background: transparent; font-size: 14px; font-weight: 500; color: var(--ink); font-family: 'Inter', sans-serif; width: 100%; padding: 2px 0; }
    .kpi-label input:focus { outline: none; border-bottom: 1px solid var(--navy); }

    .num-input { border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13.5px; font-family: 'Inter', sans-serif; width: 100%; color: var(--ink); background: var(--paper); }
    .num-input:focus { outline: none; border-color: var(--navy); background: white; }

    .bar-cell { display: flex; align-items: center; gap: 8px; }
    .bar-track { flex: 1; height: 7px; border-radius: 4px; background: var(--border); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .bar-fill.good { background: var(--good); }
    .bar-fill.warn { background: var(--warn); }
    .bar-fill.risk { background: var(--risk); }
    .bar-pct { font-size: 12.5px; font-weight: 600; width: 38px; text-align: right; font-family: 'Space Grotesk', sans-serif; }

    .status-chip { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; text-align: center; white-space: nowrap; }
    .status-chip.good { background: var(--good-soft); color: var(--good); }
    .status-chip.warn { background: var(--warn-soft); color: var(--warn); }
    .status-chip.risk { background: var(--risk-soft); color: var(--risk); }

    .add-kpi-row { padding: 10px 20px; display: flex; gap: 8px; }
    .add-kpi-row input { flex: 1; border: 1px dashed var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: 'Inter', sans-serif; background: transparent; color: var(--ink); }
    .add-kpi-row input:focus { outline: none; border-color: var(--navy); border-style: solid; }
    .add-kpi-row button { border: none; background: var(--navy); color: white; border-radius: 6px; padding: 0 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
    .add-kpi-row button:hover { opacity: 0.9; }

    .add-kra { text-align: center; margin-top: 8px; }
    .add-kra button { border: 1px dashed var(--border); background: transparent; color: var(--muted); border-radius: 10px; padding: 10px 18px; font-size: 13.5px; cursor: pointer; font-family: 'Inter', sans-serif; }
    .add-kra button:hover { border-color: var(--navy); color: var(--navy); }

    .footer-note { text-align: center; color: var(--faint); font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
  /* ============================================================
     STORAGE POLYFILL
     Ensures smooth persistence in any hosting environment using localStorage
  ============================================================ */
  if (!window.storage) {
    window.storage = {
      async get(key) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? { value: val } : null;
        } catch (e) {
          console.error('Storage read error:', e);
          return null;
        }
      },
      async set(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (e) {
          console.error('Storage write error:', e);
          return false;
        }
      }
    };
  }

  /* ============================================================
     SHARED
  ============================================================ */
  let activeTab = 'plan';

  function switchTab(tab) {
    activeTab = tab;
    renderShell();
  }

  function checkIcon() {
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }

  /* ============================================================
     PANEL 1: MONTHLY PLAN (checklist)
  ============================================================ */
  const PLAN_SECTIONS = [
    { id: 'innovation', title: 'Innovation', tag: 'One experiment this month', tasks: [
      'Pick one new idea, tool, or format to test',
      'Run the test',
      "Document what worked and what didn't"
    ]},
    { id: 'value', title: 'Value Addition', tag: 'One new offering', tasks: [
      'Identify one extra (bonus, guide, perk, improvement)',
      'Roll it out',
      'Gather feedback on it'
    ]},
    { id: 'website', title: 'Website', tag: 'Ongoing — no fixed schedule', ongoing: true, tasks: [
      'Set up fully autonomous, no-code / AI-tool system',
      'Push changes as needed (new content, fixes, offers)',
      'Check nothing is broken every so often'
    ]},
    { id: 'offline', title: 'Offline Marketing (BTL) / Stickers / Merchandise', tag: 'Physical', tasks: [
      'Finalize designs for stickers/merchandise/tote bags/any creatives'
    ]},
    { id: 'social', title: 'Social Media Posts', tag: '10 posts / month', countPrefix: 'Post', tasks: [
      'Plan content for 10 posts this month',
      'Post 1',
      'Post 2',
      'Post 3',
      'Post 4',
      'Post 5',
      'Post 6',
      'Post 7',
      'Post 8',
      'Post 9',
      'Post 10',
      'Track what performs best and adjust'
    ]},
    { id: 'ads', title: 'Meta Ads', tag: 'Paid', tasks: [
      'Set up campaigns, audiences, creatives',
      'Launch and monitor performance',
      'Optimize — pause weak ones, scale winners'
    ]},
    { id: 'video', title: 'Video Editing → Testimonial, Reels', tag: '2 reels / month', countPrefix: 'Reel', tasks: [
      'Collect testimonials from customers',
      'Reel 1',
      'Reel 2',
      'Publish and promote across channels'
    ]},
  ];

  let planState = {};
  let planNotesOpen = {};
  let planListOpen = {};

  function planDefaultState(section) {
    return { tasks: section.tasks.map(label => ({ label, done: false })), notes: '' };
  }

  async function planLoad() {
    for (const section of PLAN_SECTIONS) {
      try {
        const res = await window.storage.get('plan:' + section.id);
        planState[section.id] = res ? JSON.parse(res.value) : planDefaultState(section);
      } catch (e) {
        planState[section.id] = planDefaultState(section);
      }
    }
  }

  async function planSaveSection(id) {
    try { await window.storage.set('plan:' + id, JSON.stringify(planState[id])); }
    catch (e) { console.error('Save failed', e); }
  }

  function planToggleTask(sectionId, idx) {
    planState[sectionId].tasks[idx].done = !planState[sectionId].tasks[idx].done;
    planSaveSection(sectionId);
    renderShell();
  }
  function planDeleteTask(sectionId, idx) {
    planState[sectionId].tasks.splice(idx, 1);
    planSaveSection(sectionId);
    renderShell();
  }
  function planAddTask(sectionId, value) {
    if (!value.trim()) return;
    planState[sectionId].tasks.push({ label: value.trim(), done: false });
    planSaveSection(sectionId);
    renderShell();
  }
  function planUpdateNotes(sectionId, value) {
    planState[sectionId].notes = value;
    planSaveSection(sectionId);
  }
  function planToggleNotes(sectionId) {
    planNotesOpen[sectionId] = !planNotesOpen[sectionId];
    renderShell();
  }
  function planToggleList(sectionId) {
    planListOpen[sectionId] = !planListOpen[sectionId];
    renderShell();
  }
  function planOverallProgress() {
    let total = 0, done = 0;
    for (const s of PLAN_SECTIONS) {
      const st = planState[s.id];
      if (!st) continue;
      total += st.tasks.length;
      done += st.tasks.filter(t => t.done).length;
    }
    return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
  }

  function planCountProgress(section) {
    if (!section.countPrefix) return null;
    const st = planState[section.id];
    if (!st) return null;
    const matching = st.tasks.filter(t => t.label.trim().startsWith(section.countPrefix + ' '));
    const done = matching.filter(t => t.done).length;
    return { done, total: matching.length, label: section.countPrefix };
  }

  function renderPlanPanel() {
    const prog = planOverallProgress();
    const circumference = 2 * Math.PI * 18;
    const offset = circumference - (prog.pct / 100) * circumference;

    let html = `
      <div class="plan-progress">
        <div class="ring">
          <svg width="44" height="44" viewBox="0 0 44 44">
            <circle class="ring-bg" cx="22" cy="22" r="18"/>
            <circle class="ring-fg" cx="22" cy="22" r="18" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
          </svg>
          <div class="ring-num">${prog.pct}%</div>
        </div>
        <div class="progress-text"><strong>${prog.done} / ${prog.total}</strong><br>tasks done</div>
      </div>
      <div class="grid">
    `;

    for (const section of PLAN_SECTIONS) {
      const st = planState[section.id];
      if (!st) continue;
      const doneCount = st.tasks.filter(t => t.done).length;
      const countProg = planCountProgress(section);

      html += `
        <div class="card">
          <div class="card-head">
            <div class="card-title">${section.title}</div>
            <div class="card-count">${doneCount}/${st.tasks.length}</div>
          </div>
          <div class="card-tag">${section.ongoing ? `<span class="status-pill ongoing">${section.tag}</span>` : section.tag}${countProg ? ` · <strong style="color:var(--ink);">${countProg.done}/${countProg.total} ${countProg.label.toLowerCase()}s done</strong>` : ''}</div>
          <div class="tasks">
      `;

      st.tasks.forEach((t, idx) => {
        const isCounted = section.countPrefix && t.label.trim().startsWith(section.countPrefix + ' ');
        if (isCounted) return; // rendered separately in the dropdown below
        html += `
          <div class="task ${t.done ? 'done' : ''}" data-section="${section.id}" data-idx="${idx}" data-action="toggle">
            <div class="check ${t.done ? 'on' : ''}">${checkIcon()}</div>
            <div class="task-label">${t.label}</div>
            <div class="del-x" data-section="${section.id}" data-idx="${idx}" data-action="delete">×</div>
          </div>
        `;
      });

      if (countProg) {
        const isOpen = !!planListOpen[section.id];
        html += `
            <div class="notes-toggle" data-plan-list-toggle="${section.id}" style="border-top:none;padding-top:2px;margin-top:2px;">
              ${isOpen ? '▾' : '▸'} ${countProg.label}s (${countProg.done}/${countProg.total})
            </div>
        `;
        if (isOpen) {
          st.tasks.forEach((t, idx) => {
            const isCounted = section.countPrefix && t.label.trim().startsWith(section.countPrefix + ' ');
            if (!isCounted) return;
            html += `
              <div class="task ${t.done ? 'done' : ''}" data-section="${section.id}" data-idx="${idx}" data-action="toggle" style="padding-left:14px;">
                <div class="check ${t.done ? 'on' : ''}">${checkIcon()}</div>
                <div class="task-label">${t.label}</div>
                <div class="del-x" data-section="${section.id}" data-idx="${idx}" data-action="delete">×</div>
              </div>
            `;
          });
        }
      }

      html += `
          </div>
          <div class="add-row">
            <input type="text" placeholder="Add a task…" data-plan-add-input="${section.id}" />
            <button data-plan-add-btn="${section.id}">Add</button>
          </div>
          <div class="notes-toggle" data-plan-notes-toggle="${section.id}">
            ${planNotesOpen[section.id] ? '▾ Hide notes' : '▸ Notes'}
          </div>
          ${planNotesOpen[section.id] ? `<textarea class="notes" data-plan-notes-input="${section.id}" placeholder="Any notes for this section…">${st.notes || ''}</textarea>` : ''}
        </div>
      `;
    }

    html += `</div><div class="footer-note">Data is saved automatically as you check things off.</div>`;
    return html;
  }

  function attachPlanEvents() {
    document.querySelectorAll('[data-action="toggle"]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="delete"]')) return;
        planToggleTask(el.dataset.section, parseInt(el.dataset.idx));
      });
    });
    document.querySelectorAll('[data-action="delete"]').forEach(el => {
      el.addEventListener('click', (e) => { e.stopPropagation(); planDeleteTask(el.dataset.section, parseInt(el.dataset.idx)); });
    });
    document.querySelectorAll('[data-plan-add-btn]').forEach(el => {
      el.addEventListener('click', () => {
        const input = document.querySelector(`[data-plan-add-input="${el.dataset.planAddBtn}"]`);
        planAddTask(el.dataset.planAddBtn, input.value);
        input.value = '';
      });
    });
    document.querySelectorAll('[data-plan-add-input]').forEach(el => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { planAddTask(el.dataset.planAddInput, el.value); el.value = ''; }
      });
    });
    document.querySelectorAll('[data-plan-notes-toggle]').forEach(el => {
      el.addEventListener('click', () => planToggleNotes(el.dataset.planNotesToggle));
    });
    document.querySelectorAll('[data-plan-list-toggle]').forEach(el => {
      el.addEventListener('click', () => planToggleList(el.dataset.planListToggle));
    });
    document.querySelectorAll('[data-plan-notes-input]').forEach(el => {
      el.addEventListener('input', () => planUpdateNotes(el.dataset.planNotesInput, el.value));
      el.addEventListener('blur', () => planUpdateNotes(el.dataset.planNotesInput, el.value));
    });
  }

  /* ============================================================
     PANEL 2: KPI / KRA
  ============================================================ */
  const KPI_STORAGE_KEY = 'kpi-kra:data';
  const KPI_DEFAULT_DATA = {
    kras: [
      { id: 'kra_growth', title: 'Sales & Growth', kpis: [
        { id: 'k1', label: 'SEO organic traffic growth', target: 20, actual: 0, unit: '% growth' },
        { id: 'k2', label: 'New sales / revenue growth', target: 15, actual: 0, unit: '% growth' },
      ]},
      { id: 'kra_content', title: 'Content & Social Media', kpis: [
        { id: 'k3', label: 'Social media posts published', target: 10, actual: 0, unit: 'posts' },
        { id: 'k4', label: 'Reels produced', target: 2, actual: 0, unit: 'reels' },
        { id: 'k5', label: 'Testimonials collected', target: 2, actual: 0, unit: 'testimonials' },
      ]},
      { id: 'kra_ads', title: 'Meta Ads', kpis: [
        { id: 'k6', label: 'Leads generated', target: 50, actual: 0, unit: 'leads' },
        { id: 'k7', label: 'Ad spend efficiency (ROAS)', target: 3, actual: 0, unit: 'x' },
      ]},
      { id: 'kra_offline', title: 'Offline Marketing (BTL)', kpis: [
        { id: 'k8', label: 'Merchandise / stickers distributed', target: 500, actual: 0, unit: 'units' },
      ]},
      { id: 'kra_website', title: 'Website', kpis: [
        { id: 'k9', label: 'Site updates pushed', target: 4, actual: 0, unit: 'updates' },
      ]},
      { id: 'kra_innovation', title: 'Innovation & Value Addition', kpis: [
        { id: 'k10', label: 'New experiments tested', target: 1, actual: 0, unit: 'experiment' },
        { id: 'k11', label: 'New value-adds shipped', target: 1, actual: 0, unit: 'value-add' },
      ]},
    ]
  };

  let kpiData = null;
  let kpiIdCounter = 100;
  function kpiUid() { return 'id_' + (kpiIdCounter++) + '_' + Date.now(); }

  async function kpiLoad() {
    try {
      const res = await window.storage.get(KPI_STORAGE_KEY);
      kpiData = res ? JSON.parse(res.value) : JSON.parse(JSON.stringify(KPI_DEFAULT_DATA));
    } catch (e) {
      kpiData = JSON.parse(JSON.stringify(KPI_DEFAULT_DATA));
    }
  }
  async function kpiSave() {
    try { await window.storage.set(KPI_STORAGE_KEY, JSON.stringify(kpiData)); }
    catch (e) { console.error('Save failed', e); }
  }

  function kpiPctFor(kpi) {
    const target = parseFloat(kpi.target);
    const actual = parseFloat(kpi.actual);
    if (!target || target === 0 || isNaN(actual)) return 0;
    return Math.max(0, Math.round((actual / target) * 100));
  }
  function kpiStatusFor(pct) {
    if (pct >= 80) return 'good';
    if (pct >= 50) return 'warn';
    return 'risk';
  }
  function kpiStatusLabel(status) {
    if (status === 'good') return 'On track';
    if (status === 'warn') return 'Behind';
    return 'At risk';
  }
  function kraAverage(kra) {
    if (!kra.kpis.length) return 0;
    const sum = kra.kpis.reduce((acc, k) => acc + Math.min(kpiPctFor(k), 100), 0);
    return Math.round(sum / kra.kpis.length);
  }
  function kpiOverallStats() {
    let allKpis = [];
    kpiData.kras.forEach(k => allKpis = allKpis.concat(k.kpis));
    if (!allKpis.length) return { avg: 0, good: 0, warn: 0, risk: 0, total: 0 };
    let sum = 0, good = 0, warn = 0, risk = 0;
    allKpis.forEach(k => {
      const p = kpiPctFor(k);
      sum += Math.min(p, 100);
      const s = kpiStatusFor(p);
      if (s === 'good') good++; else if (s === 'warn') warn++; else risk++;
    });
    return { avg: Math.round(sum / allKpis.length), good, warn, risk, total: allKpis.length };
  }

  function kpiUpdateField(kraId, kpiId, field, value) {
    const kra = kpiData.kras.find(k => k.id === kraId);
    const kpi = kra.kpis.find(k => k.id === kpiId);
    kpi[field] = value;
    kpiSave();
    renderShell();
  }
  function kpiDelete(kraId, kpiId) {
    const kra = kpiData.kras.find(k => k.id === kraId);
    kra.kpis = kra.kpis.filter(k => k.id !== kpiId);
    kpiSave();
    renderShell();
  }
  function kpiAdd(kraId, label) {
    if (!label.trim()) return;
    const kra = kpiData.kras.find(k => k.id === kraId);
    kra.kpis.push({ id: kpiUid(), label: label.trim(), target: 100, actual: 0, unit: '' });
    kpiSave();
    renderShell();
  }
  function kraAdd() {
    kpiData.kras.push({ id: kpiUid(), title: 'New KRA', kpis: [] });
    kpiSave();
    renderShell();
  }
  function kraUpdateTitle(kraId, value) {
    const kra = kpiData.kras.find(k => k.id === kraId);
    kra.title = value;
    kpiSave();
  }

  function renderKpiPanel() {
    const stats = kpiOverallStats();

    let html = `
      <div class="summary">
        <div class="stat">
          <div class="stat-label">Overall achievement</div>
          <div class="stat-value">${stats.avg}<span>%</span></div>
        </div>
        <div class="stat">
          <div class="stat-label"><span class="dot good"></span>On track</div>
          <div class="stat-value">${stats.good}<span>KPIs</span></div>
        </div>
        <div class="stat">
          <div class="stat-label"><span class="dot warn"></span>Behind</div>
          <div class="stat-value">${stats.warn}<span>KPIs</span></div>
        </div>
        <div class="stat">
          <div class="stat-label"><span class="dot risk"></span>At risk</div>
          <div class="stat-value">${stats.risk}<span>KPIs</span></div>
        </div>
      </div>
    `;

    kpiData.kras.forEach(kra => {
      const avg = kraAverage(kra);
      const avgStatus = kpiStatusFor(avg);

      html += `
        <div class="kra-card">
          <div class="kra-head">
            <input style="border:none;background:transparent;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--navy);width:auto;min-width:180px;"
                   value="${escapeAttr(kra.title)}" data-kra-title="${kra.id}" />
            <div class="kra-avg">
              KRA average: <strong>${avg}%</strong>
              <span class="status-chip ${avgStatus}">${kpiStatusLabel(avgStatus)}</span>
            </div>
          </div>
          <div class="kpi-row head-row">
            <div>KPI</div><div>Target</div><div>Actual</div><div>Progress</div><div>Status</div><div></div>
          </div>
      `;

      kra.kpis.forEach(kpi => {
        const pct = kpiPctFor(kpi);
        const displayPct = Math.min(pct, 100);
        const status = kpiStatusFor(pct);

        html += `
          <div class="kpi-row">
            <div class="kpi-cell kpi-label" data-label="KPI">
              <input value="${escapeAttr(kpi.label)}" data-kpi-field="label" data-kra="${kra.id}" data-kpi="${kpi.id}" />
            </div>
            <div class="kpi-cell" data-label="Target">
              <input class="num-input" type="number" value="${kpi.target}" data-kpi-field="target" data-kra="${kra.id}" data-kpi="${kpi.id}" />
            </div>
            <div class="kpi-cell" data-label="Actual">
              <input class="num-input" type="number" value="${kpi.actual}" data-kpi-field="actual" data-kra="${kra.id}" data-kpi="${kpi.id}" />
            </div>
            <div class="kpi-cell bar-cell" data-label="Progress">
              <div class="bar-track"><div class="bar-fill ${status}" style="width:${displayPct}%"></div></div>
              <div class="bar-pct">${pct}%</div>
            </div>
            <div class="kpi-cell" data-label="Status">
              <span class="status-chip ${status}">${kpiStatusLabel(status)}</span>
            </div>
            <div class="del-x" data-delete-kpi="${kra.id}" data-kpi-id="${kpi.id}">×</div>
          </div>
        `;
      });

      html += `
          <div class="add-kpi-row">
            <input type="text" placeholder="Add a KPI to this KRA…" data-add-kpi-input="${kra.id}" />
            <button data-add-kpi-btn="${kra.id}">Add KPI</button>
          </div>
        </div>
      `;
    });

    html += `
      <div class="add-kra"><button id="addKraBtn">+ Add a KRA</button></div>
      <div class="footer-note">Edit target and actual numbers directly — progress and status update automatically. Saved as you type.</div>
    `;
    return html;
  }

  function attachKpiEvents() {
    document.querySelectorAll('[data-kpi-field]').forEach(el => {
      const commit = () => {
        const field = el.dataset.kpiField;
        let val = el.value;
        if (field === 'target' || field === 'actual') val = parseFloat(val) || 0;
        kpiUpdateField(el.dataset.kra, el.dataset.kpi, field, val);
      };
      el.addEventListener('change', commit);
      el.addEventListener('blur', commit);
    });
    document.querySelectorAll('[data-delete-kpi]').forEach(el => {
      el.addEventListener('click', () => kpiDelete(el.dataset.deleteKpi, el.dataset.kpiId));
    });
    document.querySelectorAll('[data-add-kpi-btn]').forEach(el => {
      el.addEventListener('click', () => {
        const input = document.querySelector(`[data-add-kpi-input="${el.dataset.addKpiBtn}"]`);
        kpiAdd(el.dataset.addKpiBtn, input.value);
        input.value = '';
      });
    });
    document.querySelectorAll('[data-add-kpi-input]').forEach(el => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { kpiAdd(el.dataset.addKpiInput, el.value); el.value = ''; }
      });
    });
    document.querySelectorAll('[data-kra-title]').forEach(el => {
      el.addEventListener('blur', () => kraUpdateTitle(el.dataset.kraTitle, el.value));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.blur(); });
    });
    const addKraBtn = document.getElementById('addKraBtn');
    if (addKraBtn) addKraBtn.addEventListener('click', kraAdd);
  }

  /* ============================================================
     SHELL
  ============================================================ */
  function renderShell() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="wrap">
        <div class="top">
          <div>
            <h1>Growth Dashboard</h1>
            <p class="sub">Monthly execution plan and KPI / KRA tracking, in one place</p>
          </div>
        </div>
        <div class="tabs">
          <button class="tab ${activeTab === 'plan' ? 'active' : ''}" data-tab="plan">Monthly Plan</button>
          <button class="tab ${activeTab === 'kpi' ? 'active' : ''}" data-tab="kpi">KPI / KRA</button>
        </div>
        <div class="panel ${activeTab === 'plan' ? 'active' : ''}" id="planPanel">${renderPlanPanel()}</div>
        <div class="panel ${activeTab === 'kpi' ? 'active' : ''}" id="kpiPanel">${renderKpiPanel()}</div>
      </div>
    `;

    document.querySelectorAll('[data-tab]').forEach(el => {
      el.addEventListener('click', () => switchTab(el.dataset.tab));
    });

    attachPlanEvents();
    attachKpiEvents();
  }

  async function init() {
    await Promise.all([planLoad(), kpiLoad()]);
    renderShell();
  }

  init();
  </script>
</body>
</html>
